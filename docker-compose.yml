version: "3.8"

services:
  sqliteguard:
    image: ghcr.io/zxjyyh/sqliteguard:latest
    container_name: sqliteguard
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # 数据持久化：改成 NAS 上的实际路径
      - ./data:/app/data
    environment:
      # ====== 必填 ======
      # JWT 密钥（务必改成你自己的随机字符串！）
      - JWT_SECRET=请修改为你自己的随机密钥至少32位
      # ====== 可选 ======
      # - PORT=5000
      # - CORS_ORIGINS=*
      # - FLASK_DEBUG=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
